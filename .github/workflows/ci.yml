name: CI

on:
  # Only main is long-lived, so only main is watched on push. Everything else
  # reaches main through a pull request, and the pull_request trigger is left
  # unfiltered so any topic branch is checked. Listing a branch under both
  # triggers would run the whole suite twice for one commit.
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml so a release is gated on exactly these checks rather
  # than a copy of them that can drift.
  workflow_call:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: both jobs only build and test, so the token needs nothing
# beyond reading the checked-out code. Without this block the workflow inherits
# the repository default, which may be read/write.
permissions:
  contents: read

jobs:
  analyze:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Run package tests
        run: flutter test

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run example widget tests
        working-directory: example
        run: flutter test

      # Must run before the Gradle step below: the Gradle wrapper is gitignored
      # by the Flutter template and is written by the tool during an Android
      # build (injectGradleWrapperIfNeeded). Reordering these breaks the build.
      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

      - name: Run plugin Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :telephony_sms:testDebugUnitTest

      # example/integration_test/ is deliberately absent from this workflow. It
      # drives the real SmsManager and needs a handset with a SIM, which no
      # hosted runner has. Run it with `flutter test integration_test` on a
      # device before a release.
